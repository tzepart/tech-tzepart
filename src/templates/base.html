<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
{% if description %}
  <meta name="description" content="{{ description }}">
{% endif %}
  <link rel="stylesheet" href="{{ root }}static/style.css">
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      try {
        var root = document.documentElement, theme = localStorage.getItem("theme");
        if (localStorage.getItem("layout") === "wide") root.classList.add("wide");
        if (theme === "dark" || theme === "light") root.setAttribute("data-theme", theme);
      } catch (e) {}
    })();
  </script>
  <script src="{{ root }}static/layout.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap wrap-wide">
      <a class="logo" href="{{ root }}">tech<span>.</span>tzepart</a>
      <div class="header-actions">
        <button class="icon-button width-toggle" type="button" aria-pressed="false" aria-label="Full width" title="Full width" hidden>
          <svg class="icon-wide" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M3 5v14M21 5v14M7 12h10M10 9l-3 3 3 3M14 9l3 3-3 3" />
          </svg>
          <svg class="icon-narrow" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M12 5v14M3 12h6M15 12h6M6 9l3 3-3 3M18 9l-3 3 3 3" />
          </svg>
        </button>
        <button class="icon-button theme-toggle" type="button" aria-label="Switch to night mode" title="Switch to night mode" hidden>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="{% block main_class %}wrap{% endblock %}">
{% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="wrap wrap-wide">
      <a href="https://github.com/tzepart/tech-tzepart">GitHub</a>
    </div>
  </footer>
{% if mermaid %}

  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script>
    (function () {
      var darkQuery = window.matchMedia("(prefers-color-scheme: dark)");
      var nodes = Array.prototype.slice.call(document.querySelectorAll("pre.mermaid"));
      nodes.forEach(function (node) { node.dataset.source = node.textContent; });

      function render() {
        var theme = document.documentElement.getAttribute("data-theme") || (darkQuery.matches ? "dark" : "light");
        nodes.forEach(function (node) {
          node.removeAttribute("data-processed");
          node.textContent = node.dataset.source;
        });
        mermaid.initialize({ startOnLoad: false, theme: theme === "dark" ? "dark" : "default" });
        mermaid.run({ nodes: nodes });
      }

      render();
      document.addEventListener("themechange", render);
      darkQuery.addEventListener("change", render);
    })();
  </script>
{% endif %}
{% block scripts %}{% endblock %}
</body>
</html>
