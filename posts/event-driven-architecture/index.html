  <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script src="../../assets/js/main.js"></script>
  <script>
    (function () {
      var contentEl = document.getElementById("markdownContent");
      var tocList = document.getElementById("tocList");

      function slugify(text) {
        return text
          .toLowerCase()
          .trim()
          .replace(/[^a-z0-9\s-]/g, "")
          .replace(/\s+/g, "-");
      }

      fetch("post.md")
        .then(function (res) {
          if (!res.ok) throw new Error("Failed to fetch post.md: " + res.status);
          return res.text();
        })
        .then(function (markdown) {
          contentEl.innerHTML = marked.parse(markdown);

          contentEl.querySelectorAll("h2").forEach(function (heading) {
            var id = slugify(heading.textContent);
            heading.id = id;

            var li = document.createElement("li");
            var a = document.createElement("a");
            a.href = "#" + id;
            a.textContent = heading.textContent;
            li.appendChild(a);
            tocList.appendChild(li);
          });

          contentEl.querySelectorAll("pre code.language-mermaid").forEach(function (block) {
            var div = document.createElement("div");
            div.className = "mermaid";
            div.textContent = block.textContent;
            block.parentElement.replaceWith(div);
          });

          var isDark =
            document.documentElement.getAttribute("data-theme") === "dark" ||
            (!document.documentElement.getAttribute("data-theme") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);

          mermaid.initialize({ startOnLoad: false, theme: isDark ? "dark" : "default" });
          mermaid.run({ nodes: contentEl.querySelectorAll(".mermaid") });
        })
        .catch(function (err) {
          contentEl.innerHTML = '<p class="markdown-loading">Could not load post content.</p>';
          console.error(err);
        });
    })();
  </script>
</body>
